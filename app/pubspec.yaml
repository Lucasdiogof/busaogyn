name: busaogyn
description: BusãoGyn — saiba onde seu ônibus está.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  flutter_bloc: ^9.1.1
  maplibre_gl: ^0.27.1
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Liberty noturno pré-derivado por tool/build_night_style.dart.
    - assets/map/liberty-night.json
    # Licença OFL das fontes Geist, exibida na tela de licenças.
    - assets/fonts/geist/OFL.txt

  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/geist/Geist-Regular.ttf
        - asset: assets/fonts/geist/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/geist/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/geist/Geist-Bold.ttf
          weight: 700
    - family: GeistMono
      fonts:
        - asset: assets/fonts/geist/GeistMono-Regular.ttf
        - asset: assets/fonts/geist/GeistMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/geist/GeistMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/geist/GeistMono-Bold.ttf
          weight: 700
