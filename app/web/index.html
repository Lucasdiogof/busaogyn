<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="BusãoGyn — saiba onde seu ônibus está.">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B0A08" media="(prefers-color-scheme: dark)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="BusãoGyn">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>BusãoGyn</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Splash até o primeiro frame do Flutter: fundo do tema do sistema e o
       selo BusãoGyn, sem depender de rede. */
    html, body { margin: 0; height: 100%; background: #FFFFFF; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #0B0A08; }
    }
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #splash img { width: 96px; height: 96px; }
    /* Os controles do MapLibre têm z-index; sem um contexto de empilhamento
       próprio eles passam por cima dos painéis do Flutter. */
    .maplibregl-map { isolation: isolate; }
    /* O plugin web ignora attributionButtonMargins: o app informa a altura
       coberta pelo painel e o controle nativo de atribuição (com os créditos
       e links do estilo em uso) fica logo acima dele. */
    .maplibregl-ctrl-bottom-right {
      bottom: var(--busao-map-attribution-bottom, 0px) !important;
      transition: bottom 150ms ease-out;
    }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <img src="icons/Icon-192.png" alt="">
  </div>
  <noscript>O BusãoGyn precisa de JavaScript habilitado.</noscript>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
