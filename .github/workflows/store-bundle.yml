name: Store bundle (unsigned build)

# Gera o app-release.aab da main num commit fixo, para ser assinado fora do
# GitHub com a chave de upload. A chave e as senhas nunca passam por aqui:
# o bundle sai assinado com a chave de debug e a assinatura é trocada depois.
on:
  push:
    branches:
      - claude/charming-pascal-4rvfwo
    paths:
      - '.github/workflows/store-bundle.yml'

env:
  FLUTTER_VERSION: '3.38.5'
  SOURCE_SHA: 7beee147306e4fe4ddbd9dd7cecf3f52fe1e3b46

jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      BUSAOGYN_ALLOW_DEBUG_SIGNED_RELEASE: 'true'
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build appbundle --release
      - run: python3 tool/check_android_release.py build/app/outputs/bundle/release/app-release.aab
      - run: sha256sum build/app/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 3
          if-no-files-found: error
