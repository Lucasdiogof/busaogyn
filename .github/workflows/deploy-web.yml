# Copy to .github/workflows/deploy-web.yml and edit the env block.
# Repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (the account that hosts the web app; the API worker uses the `production` environment secrets).
# Safety switch: nothing runs on push until the repo VARIABLE AUTO_DEPLOY is "true"
# (Settings > Secrets and variables > Actions > Variables). Manual runs always work.
# Public domain: stays off until the `routes` block in wrangler.jsonc is uncommented (after QA approval).
# Cost: public repos run Actions free; private repos use the 2,000 min/month quota (blocked, not billed, without a payment method).
name: Deploy web to Cloudflare Workers
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-web
  cancel-in-progress: true
env:
  FLUTTER_VERSION: "3.38.5"        # same as flutter-ci.yml: app/pubspec.lock is resolved with it
  APP_DIR: "app"                    # folder with pubspec.yaml and wrangler.jsonc (OrbiJob: app)
  FLUTTER_WEB_FLAGS: ""             # e.g. --no-web-resources-cdn
  # Only live URLs. The workers.dev address answers 404 (error 1042) since the custom domain went live (checked 2026-10-28).
  SMOKE_URLS: "https://busaogyn.lucksrei.com"
  SMOKE_ROUTES: "/ponto/30402 /linhas"  # SPA deep links that must fall back to index.html
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter test
      - run: flutter build web --release $FLUTTER_WEB_FLAGS
      - run: bash scripts/check-bundle-secrets.sh build/web
      # CMTC data license is pending: never publish a bundle that contains the official catalog.
      - run: bash scripts/check-no-official-catalog.sh build/web
      - uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: "4"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ env.APP_DIR }}
          command: deploy
      - name: Smoke test (public URLs, fails the workflow on a bad publish)
        run: |
          for u in $SMOKE_URLS; do bash scripts/smoke-test.sh "$u" $SMOKE_ROUTES || exit 1; done
