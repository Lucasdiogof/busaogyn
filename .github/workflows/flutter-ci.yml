name: Flutter CI

on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/flutter-ci.yml'
  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - 'app/**'
      - '.github/workflows/flutter-ci.yml'

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
