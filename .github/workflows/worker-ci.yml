name: Worker CI

on:
  pull_request:
    paths:
      - 'worker/**'
      - '.github/workflows/worker-ci.yml'
  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - 'worker/**'
      - '.github/workflows/worker-ci.yml'

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: node --check scripts/smoke-local-api.mjs
