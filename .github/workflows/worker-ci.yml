name: Worker CI

on:
  pull_request:
    paths:
      - 'worker/**'
      - '.github/workflows/worker-ci.yml'
  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - 'worker/**'
      - '.github/workflows/worker-ci.yml'

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node --check scripts/smoke-local-api.mjs
