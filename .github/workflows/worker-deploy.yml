name: Deploy Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --var BUILD_SHA:${GITHUB_SHA}
      - name: Smoke production ETA and tracking
        env:
          BUSAOGYN_API_BASE_URL: https://busaogyn-api.lively-cloud-f009.workers.dev
          BUSAOGYN_EXPECTED_ENVIRONMENT: production
        run: node scripts/smoke-local-api.mjs
